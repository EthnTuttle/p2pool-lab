name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - run: nix develop --command gitleaks dir . --redact --no-banner
      - run: nix flake check --print-build-logs
      - run: nix build --no-link --print-build-logs
